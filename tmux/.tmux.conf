# =============================================================================
# General
# =============================================================================

unbind-key -a -T root

set -g default-terminal "tmux-256color"

set -g xterm-keys on
set -s extended-keys on

set -s escape-time 0

set -g history-limit 50000


# =============================================================================
# Prefix
# =============================================================================

# Prefix: `
set -g prefix `
unbind-key C-b

# Press ` twice to send a literal ` to the application.
bind-key ` send-prefix


# =============================================================================
# Windows / Panes
# =============================================================================

# Modern double pane borders.
set -g pane-border-lines double

# Start numbering from 1.
set -g base-index 1
set -g pane-base-index 1

# Keep window numbering compact after closing windows.
set -g renumber-windows on

# Vi-style copy mode.
setw -g mode-keys vi


# =============================================================================
# Reload / Tree
# =============================================================================

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind -n M-s choose-tree -s


# =============================================================================
# Window switching
# =============================================================================

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# =============================================================================
# Pane navigation
# =============================================================================

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D


# =============================================================================
# Pane resizing
# =============================================================================

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3


# =============================================================================
# Pane / Window creation
# =============================================================================

# Alt+h  -> split top/bottom
# Alt+v  -> split left/right
bind -n M-h split-window -v
bind -n M-v split-window -h

# Alt+Enter -> new window
bind -n M-Enter new-window


# =============================================================================
# Closing
# =============================================================================

# Confirm destructive actions.
bind -n M-c confirm-before -p "Kill pane? (y/n)" kill-pane
bind -n M-q confirm-before -p "Kill window? (y/n)" kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session


# =============================================================================
# Copy mode / Clipboard
# =============================================================================

# Start selection.
bind -T copy-mode-vi v send -X begin-selection

# Copy to Wayland clipboard, fallback to X11 clipboard.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel \
    "wl-copy || xclip -in -selection clipboard"

# Search down.
bind -n M-/ copy-mode \; \
    command-prompt -p "(search down)" \
    "send -X search-forward '%%%'"

# Search up.
bind -n M-? copy-mode \; \
    command-prompt -p "(search up)" \
    "send -X search-backward '%%%'"

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position top
set -g status-justify left

set -g status-left-length 85
set -g status-left ""

set -g status-style "bg=default,fg=#fff4d2"

set -g status-right \
    "#[bg=#d8a657,fg=#000000,bold] #S "

# Inactive window
set -g window-status-format \
    "#[fg=#fff4d2,bg=#484848,bold] [ ] #I #[fg=#222222,bg=#a89984,bold] #W "

# Active window
set -g window-status-current-format \
    "#[fg=#000000,bg=#d8a657,bold] [x] #I #[fg=#000000,bg=#83a598,bold] #W "


# =============================================================================
# Messages
# =============================================================================

set -g message-style \
    "bg=#d8a657,fg=#1d1d1d,bold"

set -g message-command-style \
    "bg=#1d1d1d,fg=#d8a657,bold"


# =============================================================================
# Pane Borders
# =============================================================================

set -g pane-active-border-style \
    "fg=#d8a657"

set -g pane-border-style \
    "fg=#484848"
